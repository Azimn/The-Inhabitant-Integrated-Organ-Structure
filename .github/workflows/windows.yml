name: Windows Inhabitant smoke
on:
  push:
    branches:
      - prototype/complete-inhabitant-v1
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile donor packages
        run: python -m compileall -q inhabitant vendor tests
      - name: Cross-organ unit and restart battery on Windows
        run: python -m unittest discover -s tests -v
      - name: Complete seven-day Windows simulation
        run: python -m inhabitant.cli simulate --root .windows-ci-state --days 7
      - name: Verify canonical archive on Windows
        run: python -m inhabitant.cli verify --root .windows-ci-state
